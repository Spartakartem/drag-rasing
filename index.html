<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>Драг Рейсинг — Война Кланов</title>
<style>
  *{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent}
  html,body{height:100%;overflow:hidden;background:#05060f;
    font-family:'Segoe UI',system-ui,-apple-system,sans-serif;color:#fff}
  #app{position:relative;width:100%;height:100%}
  canvas#game{display:block;position:absolute;top:0;left:0;width:100%;height:100%}

  .screen{position:absolute;top:0;right:0;bottom:0;left:0;
    display:flex;align-items:center;justify-content:center;
    background:radial-gradient(circle at 50% 40%,rgba(30,20,70,.9),rgba(3,4,10,.98));
    z-index:20;padding:14px}
  .screen.hidden{display:none}

  .overlay{position:absolute;top:0;right:0;bottom:0;left:0;z-index:20;pointer-events:none}
  .overlay.hidden{display:none}
  .overlay > *{pointer-events:auto}

  .panel{text-align:center;padding:34px 40px;border:1px solid rgba(120,160,255,.25);
    border-radius:20px;background:rgba(12,16,34,.94);
    box-shadow:0 0 60px rgba(60,110,255,.18);
    max-width:94vw;width:100%}
  .panel.wide{max-width:1000px;width:94vw;max-height:92vh;
    display:flex;flex-direction:column;padding:24px 28px}

  h2{font-size:clamp(20px,4vw,30px);letter-spacing:.1em;margin:0}
  .sub{margin-top:8px;color:#8fa2c9;font-size:12px;letter-spacing:.12em;text-transform:uppercase}

  .panel-head{display:flex;justify-content:space-between;align-items:center;
    padding-bottom:14px;border-bottom:1px solid rgba(120,160,255,.15);flex:none}
  .panel-foot{padding-top:14px;border-top:1px solid rgba(120,160,255,.15);
    display:flex;justify-content:center;flex:none}

  .money-chip{font-family:monospace;font-weight:800;font-size:18px;color:#ffd166;
    background:rgba(255,209,102,.1);border:1px solid rgba(255,209,102,.3);
    border-radius:10px;padding:6px 16px}

  button{cursor:pointer;font-family:inherit;font-weight:800;letter-spacing:.1em;
    border:none;border-radius:12px;font-size:15px;padding:14px 30px;
    background:linear-gradient(180deg,#3d7bff,#1c46c9);color:#fff;
    box-shadow:0 6px 24px rgba(50,110,255,.4);transition:transform .12s,opacity .12s}
  button:hover:not(:disabled){transform:translateY(-2px)}
  button:active:not(:disabled){transform:translateY(0)}
  button:disabled{opacity:.35;cursor:not-allowed;box-shadow:none}
  button.ghost{background:rgba(80,110,180,.18);border:1px solid rgba(120,160,255,.3);
    box-shadow:none;color:#cfe0ff}
  button.ghost:hover{background:rgba(80,110,180,.3)}
  button.primary{background:linear-gradient(180deg,#3d7bff,#1c46c9)}
  button.big{padding:16px 52px;font-size:17px}

  .btn-sm{padding:8px 14px;font-size:12px;border-radius:9px;letter-spacing:.06em;
    background:linear-gradient(180deg,#3d7bff,#1c46c9);box-shadow:0 3px 12px rgba(50,110,255,.3)}
  .btn-sm.buy{background:linear-gradient(180deg,#22c55e,#12813c)}
  .btn-sm.gold{background:linear-gradient(180deg,#f0b429,#b45309)}

  /* ХАБ */
  .hub-top{position:absolute;top:16px;left:16px;right:16px;
    display:flex;justify-content:space-between;align-items:flex-start;gap:10px;flex-wrap:wrap}
  .chip{background:rgba(10,14,30,.72);border:1px solid rgba(120,160,255,.25);
    border-radius:12px;padding:10px 18px;font-family:monospace;font-weight:700;
    font-size:17px;color:#ffd166}
  .chip.best{color:#cfe0ff;font-size:13px;font-family:'Segoe UI',sans-serif;
    letter-spacing:.1em;display:flex;align-items:center;gap:8px}
  .chip.best b{font-family:monospace;color:#4dffa0;font-size:15px}
  .chip.clan-chip{color:#cfe0ff;font-size:12px;font-family:'Segoe UI',sans-serif;
    letter-spacing:.1em;display:flex;align-items:center;gap:8px}
  .chip.clan-chip b{font-family:monospace;font-size:13px;padding:2px 8px;
    border-radius:6px;letter-spacing:.1em}
  .chip.no-clan{opacity:.55;font-size:12px}

  .hub-title{position:absolute;top:84px;left:0;right:0;text-align:center;pointer-events:none}
  .car-name{font-size:clamp(22px,4.4vw,40px);font-weight:900;letter-spacing:.08em;
    color:#cfe4ff;text-shadow:0 0 30px rgba(90,150,255,.35);padding:0 12px}
  .car-sub{font-size:11px;letter-spacing:.35em;color:#6f82a8;margin-top:6px;
    text-transform:uppercase}

  .hub-stats{position:absolute;left:22px;top:50%;transform:translateY(-50%);
    width:210px;display:flex;flex-direction:column;gap:14px;pointer-events:none}
  .stat .lbl{display:flex;justify-content:space-between;font-size:10px;
    letter-spacing:.15em;color:#8fa2c9;text-transform:uppercase;margin-bottom:5px}
  .stat .lbl b{font-family:monospace;color:#cfe0ff;font-size:11px}
  .stat .bar{height:8px;border-radius:4px;background:rgba(255,255,255,.08);overflow:hidden}
  .stat .bar i{display:block;height:100%;border-radius:4px;
    background:linear-gradient(90deg,#2f7bff,#4dffa0);transition:width .45s}

  .hub-bottom{position:absolute;bottom:20px;left:0;right:0;display:flex;
    flex-direction:column;align-items:center;gap:10px;padding:0 16px}

  .difficulty-select{display:flex;gap:6px;background:rgba(10,14,30,.72);
    padding:5px;border-radius:12px;border:1px solid rgba(120,160,255,.2)}
  .difficulty-select button{padding:7px 14px;font-size:11px;border-radius:8px;
    background:transparent;box-shadow:none;color:#7d8fb5;letter-spacing:.12em}
  .difficulty-select button.active{color:#fff;background:rgba(50,90,180,.45);
    border:1px solid rgba(120,160,255,.4)}
  .difficulty-select button[data-diff="easy"].active{background:rgba(30,180,90,.3);
    border-color:rgba(77,255,160,.5)}
  .difficulty-select button[data-diff="hard"].active{background:rgba(240,160,30,.28);
    border-color:rgba(255,209,102,.5)}
  .difficulty-select button[data-diff="insane"].active{background:rgba(220,50,60,.3);
    border-color:rgba(255,93,93,.5)}

  .hub-actions{display:flex;justify-content:center;gap:8px;flex-wrap:wrap;
    align-items:center;padding:0 10px}
  .hub-actions button{padding:12px 18px;font-size:12px}
  .hub-actions button.big{padding:13px 38px;font-size:14px}

  /* СПИСКИ */
  .car-grid, .clan-list, .tourn-list{display:grid;
    grid-template-columns:repeat(auto-fill,minmax(250px,1fr));
    gap:14px;overflow-y:auto;padding:14px 4px;flex:1;margin:6px 0}
  .car-grid::-webkit-scrollbar, .clan-list::-webkit-scrollbar,
  .tourn-list::-webkit-scrollbar{width:6px}
  .car-grid::-webkit-scrollbar-thumb, .clan-list::-webkit-scrollbar-thumb,
  .tourn-list::-webkit-scrollbar-thumb{background:rgba(120,160,255,.3);border-radius:3px}

  .car-card{background:rgba(20,26,50,.72);border:1px solid rgba(120,160,255,.18);
    border-radius:14px;padding:12px;display:flex;flex-direction:column;gap:8px}
  .car-card.owned{border-color:rgba(77,255,160,.32)}
  .car-card.current{border-color:rgba(255,209,102,.65);
    box-shadow:0 0 26px rgba(255,209,102,.16)}
  .car-card canvas{width:100%;height:auto;display:block;border-radius:8px;
    background:radial-gradient(circle at 50% 65%,rgba(40,70,140,.2),rgba(0,0,0,.25))}
  .car-card h3{font-size:15px;letter-spacing:.04em;margin-bottom:3px}
  .car-card .desc{font-size:11px;color:#8fa2c9;line-height:1.35;min-height:30px}
  .card-foot{display:flex;justify-content:space-between;align-items:center;
    margin-top:4px;gap:8px}
  .price{font-family:monospace;font-weight:800;font-size:15px;color:#ffd166}
  .price.owned-t{color:#4dffa0;font-size:12px;letter-spacing:.1em}
  .tag{font-size:11px;letter-spacing:.08em;padding:5px 10px;border-radius:8px;
    font-weight:700;white-space:nowrap}
  .tag.current-tag{background:rgba(255,209,102,.15);color:#ffd166;
    border:1px solid rgba(255,209,102,.4)}
  .tag.maxed{background:rgba(77,255,160,.13);color:#4dffa0;
    border:1px solid rgba(77,255,160,.35)}
  .tag.locked-tag{background:rgba(255,93,93,.13);color:#ff8a8a;
    border:1px solid rgba(255,93,93,.35)}
  .tag.done-tag{background:rgba(120,160,255,.15);color:#9fc0ff;
    border:1px solid rgba(120,160,255,.35)}

  .mini{display:flex;align-items:center;gap:8px;font-size:10px;color:#8fa2c9;
    letter-spacing:.06em;text-transform:uppercase}
  .mini span{width:74px;flex:none}
  .mini-bar{flex:1;height:5px;border-radius:3px;background:rgba(255,255,255,.08);
    overflow:hidden}
  .mini-bar i{display:block;height:100%;border-radius:3px;
    background:linear-gradient(90deg,#2f7bff,#4dffa0)}

  /* ТЮНИНГ */
  .tune-head{display:flex;justify-content:space-between;align-items:baseline;
    padding:12px 4px 4px;flex:none}
  .tune-head #tuneCarName{font-size:18px;font-weight:800;letter-spacing:.05em}
  .muted{color:#7d8fb5;font-size:12px;letter-spacing:.08em}
  .upgrade-list{overflow-y:auto;display:flex;flex-direction:column;gap:10px;
    padding:8px 4px;flex:1;margin:6px 0}
  .upgrade-list::-webkit-scrollbar{width:6px}
  .upgrade-list::-webkit-scrollbar-thumb{background:rgba(120,160,255,.3);border-radius:3px}
  .upg-row{display:flex;align-items:center;gap:14px;background:rgba(20,26,50,.6);
    border:1px solid rgba(120,160,255,.15);border-radius:12px;padding:12px 16px}
  .upg-info{flex:1;min-width:0;text-align:left}
  .upg-name{font-weight:800;font-size:15px;letter-spacing:.04em}
  .upg-name .lvl{font-family:monospace;font-size:12px;color:#ffd166;margin-left:6px}
  .upg-desc{font-size:11px;color:#8fa2c9;margin-top:3px}
  .upg-pips{display:flex;gap:4px;flex:none}
  .upg-pips i{width:11px;height:18px;border-radius:3px;background:rgba(255,255,255,.1);
    border:1px solid rgba(120,160,255,.15)}
  .upg-pips i.on{background:linear-gradient(180deg,#4dffa0,#18a866);
    border-color:rgba(77,255,160,.6);box-shadow:0 0 8px rgba(77,255,160,.35)}
  .upg-action{flex:none;min-width:96px;display:flex;justify-content:flex-end}

  /* СТАЙЛИНГ */
  .style-car-preview{margin:8px 0;display:flex;justify-content:center;flex:none}
  .style-car-preview canvas{max-width:100%;height:auto;
    background:radial-gradient(circle at 50% 70%, rgba(40,70,140,.25), rgba(0,0,0,.2));
    border-radius:12px;border:1px solid rgba(120,160,255,.15)}
  .style-sections{overflow-y:auto;display:flex;flex-direction:column;gap:10px;
    padding:8px 4px;flex:1;margin:6px 0}
  .style-sections::-webkit-scrollbar{width:6px}
  .style-sections::-webkit-scrollbar-thumb{background:rgba(120,160,255,.3);border-radius:3px}
  .style-section{background:rgba(20,26,50,.6);border:1px solid rgba(120,160,255,.15);
    border-radius:12px;padding:10px 14px}
  .style-label{font-size:11px;letter-spacing:.15em;color:#8fa2c9;margin-bottom:8px;
    text-transform:uppercase;font-weight:700;text-align:left}
  .style-options{display:flex;gap:8px;flex-wrap:wrap}
  .style-btn{position:relative;height:38px;min-width:38px;padding:4px 10px;
    border-radius:10px;background:rgba(255,255,255,.08);
    border:2px solid rgba(120,160,255,.2);box-shadow:none;
    font-size:11px;color:#cfe0ff;letter-spacing:.04em;
    display:inline-flex;align-items:center;justify-content:center;gap:6px}
  .style-btn .swatch{width:24px;height:24px;border-radius:50%;
    border:2px solid rgba(255,255,255,.22);box-shadow:inset 0 -4px 8px rgba(0,0,0,.3)}
  .style-btn.selected{border-color:#ffd166;box-shadow:0 0 14px rgba(255,209,102,.4);
    background:rgba(255,209,102,.12)}
  .style-btn.locked{opacity:.75}
  .style-btn .cost{color:#ffd166;font-family:monospace;font-size:10px;
    background:rgba(255,209,102,.15);padding:2px 5px;border-radius:5px}

  /* КЛАНЫ */
  .clan-card{background:rgba(20,26,50,.72);border:1px solid rgba(120,160,255,.18);
    border-radius:14px;padding:14px;display:flex;flex-direction:column;gap:10px}
  .clan-card.mine{border-color:rgba(255,209,102,.6);
    box-shadow:0 0 26px rgba(255,209,102,.15)}
  .clan-card .clan-head{display:flex;align-items:center;gap:10px}
  .clan-tag{font-family:monospace;font-weight:800;font-size:14px;
    padding:4px 10px;border-radius:7px;letter-spacing:.1em}
  .clan-card h3{font-size:15px;letter-spacing:.04em}
  .clan-card .clan-bonus{font-size:11px;color:#4dffa0;letter-spacing:.06em;
    padding:5px 10px;background:rgba(77,255,160,.08);border-radius:7px;
    border:1px solid rgba(77,255,160,.2);text-align:center;font-weight:600}
  .clan-card .clan-actions{margin-top:auto;display:flex;justify-content:flex-end}
  .clan-leaderboard{background:rgba(0,0,0,.22);border-radius:10px;padding:10px 12px;
    margin-top:8px}
  .clan-lb-row{display:flex;justify-content:space-between;padding:5px 0;
    font-size:12px;border-bottom:1px dashed rgba(120,160,255,.1)}
  .clan-lb-row:last-child{border:none}
  .clan-lb-row .lb-name{color:#cfe0ff;font-weight:600}
  .clan-lb-row .lb-score{color:#8fa2c9;font-family:monospace}
  .clan-lb-row.you .lb-name{color:#ffd166;font-weight:800}
  .clan-lb-row.you .lb-score{color:#ffd166}

  /* ТУРНИРЫ */
  .tourn-card{background:rgba(20,26,50,.72);border:1px solid rgba(120,160,255,.18);
    border-radius:14px;padding:16px;display:flex;flex-direction:column;gap:10px}
  .tourn-card.locked{opacity:.6}
  .tourn-card.done{border-color:rgba(120,160,255,.4)}
  .tourn-card h3{font-size:17px;letter-spacing:.05em;display:flex;align-items:center;gap:8px}
  .tourn-card .desc{font-size:11px;color:#8fa2c9;line-height:1.4}
  .tourn-races{display:flex;flex-direction:column;gap:4px;margin:4px 0}
  .tourn-race-item{display:flex;justify-content:space-between;align-items:center;
    padding:5px 10px;background:rgba(0,0,0,.2);border-radius:7px;font-size:11px;
    color:#8fa2c9;letter-spacing:.04em}
  .tourn-race-item .rc-num{font-family:monospace;color:#5f76a0;font-weight:700}
  .tourn-race-item .rc-car{color:#cfe0ff;font-weight:600;flex:1;margin:0 8px}
  .tourn-race-item .rc-diff{font-size:10px;padding:2px 7px;border-radius:5px;
    letter-spacing:.08em;font-weight:700}
  .tourn-meta{display:flex;justify-content:space-between;align-items:center;
    font-size:11px;color:#8fa2c9;letter-spacing:.08em;padding:4px 0;
    border-top:1px solid rgba(120,160,255,.12);margin-top:2px}
  .tourn-meta b{font-family:monospace;color:#ffd166;font-size:13px}
  .tourn-meta .prize{color:#4dffa0}

  /* ТЕРРИТОРИЯ */
  .terr-legend{display:flex;gap:14px;flex-wrap:wrap;padding:10px 4px;
    font-size:11px;letter-spacing:.06em;color:#8fa2c9;flex:none}
  .legend-item{display:inline-flex;align-items:center;gap:6px}
  .legend-dot{width:9px;height:9px;border-radius:50%;display:inline-block}
  .city-map{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;
    padding:12px;background:linear-gradient(135deg, #0a0e1a, #151a2a);
    border-radius:14px;border:1px solid rgba(120,160,255,.2);flex:1;
    min-height:0;overflow-y:auto}
  @media (max-width:760px){.city-map{grid-template-columns:repeat(2,1fr)}}
  .district-tile{aspect-ratio:1.3;border-radius:10px;padding:10px;
    display:flex;flex-direction:column;justify-content:space-between;gap:4px;
    border:2px solid;position:relative;overflow:hidden;
    transition:transform .15s;cursor:pointer;
    min-height:110px}
  .district-tile:hover{transform:scale(1.03)}
  .district-tile.mine{box-shadow:inset 0 0 22px rgba(255,209,102,.25)}
  .district-tile .d-name{font-weight:800;font-size:13px;letter-spacing:.04em;
    color:#e8eeff;text-shadow:0 1px 4px #000;text-align:left}
  .district-tile .d-owner{font-family:monospace;font-weight:800;font-size:11px;
    padding:2px 7px;border-radius:5px;align-self:flex-start}
  .district-tile .d-bonus{font-size:10px;color:#9fb8d8;letter-spacing:.04em;
    text-align:left}
  .district-tile .d-defense{font-size:10px;letter-spacing:.15em;color:#8fa2c9}
  .district-tile .d-attack{position:absolute;bottom:6px;right:6px;
    font-size:10px;font-weight:800;padding:4px 8px;border-radius:6px;
    background:rgba(230,57,70,.92);color:#fff;letter-spacing:.08em;
    box-shadow:0 2px 8px rgba(230,57,70,.4)}
  .district-tile .d-mine{position:absolute;bottom:6px;right:6px;
    font-size:10px;font-weight:800;padding:3px 7px;border-radius:6px;
    background:rgba(255,209,102,.9);color:#000;letter-spacing:.08em}

  /* РЕЗУЛЬТАТЫ */
  .res-row{display:flex;justify-content:space-between;gap:34px;padding:10px 4px;
    border-bottom:1px solid rgba(120,160,255,.13);font-size:14px}
  .res-row:last-child{border:none}
  .res-row .lbl{color:#8fa2c9;text-align:left}
  .res-row .val{font-family:monospace;font-weight:700;font-size:15px}
  #resBody{margin:18px 0 14px;min-width:280px}
  .gold{color:#ffd166}.green{color:#4dffa0}.red{color:#ff5d5d}
  .res-earn{font-size:13px;letter-spacing:.15em;text-transform:uppercase;
    color:#8fa2c9;margin:6px 0 12px;display:flex;justify-content:center;
    align-items:baseline;gap:12px}
  .res-earn .earn-value{font-family:monospace;font-size:28px;font-weight:800;
    color:#ffd166;letter-spacing:0}
  .res-actions{display:flex;gap:12px;justify-content:center;flex-wrap:wrap;margin-top:12px}

  .tourn-result,.district-result{background:rgba(80,120,220,.08);
    border:1px solid rgba(120,160,255,.2);border-radius:12px;padding:12px 16px;
    margin:10px 0 4px}
  .tourn-result .tourn-name,.district-result .dr-name{font-size:12px;
    letter-spacing:.12em;color:#7d8fb5;text-transform:uppercase;margin-bottom:6px}
  .tourn-result .tourn-status,.district-result .dr-title{font-size:16px;
    font-weight:800;color:#ffd166;letter-spacing:.04em}
  .tourn-result .tourn-sub,.district-result .dr-sub{font-size:11px;color:#8fa2c9;
    margin-top:3px;letter-spacing:.06em}
  .district-result.success{background:rgba(77,255,160,.1);
    border-color:rgba(77,255,160,.4)}
  .district-result.success .dr-title{color:#4dffa0}
  .district-result.fail{background:rgba(255,93,93,.08);
    border-color:rgba(255,93,93,.3)}
  .district-result.fail .dr-title{color:#ff5d5d}

  /* ТАЧ */
  .touch{position:absolute;bottom:0;left:0;right:0;display:none;
    justify-content:space-between;padding:0 18px 18px;z-index:15;pointer-events:none}
  .touch.off{display:none!important}
  .touch button{pointer-events:auto;width:112px;height:112px;border-radius:50%;
    font-size:14px;letter-spacing:.1em;opacity:.88}
  #gasBtn{background:linear-gradient(180deg,#22c55e,#12813c)}
  #shiftBtn{background:linear-gradient(180deg,#f59e0b,#b45309);font-size:28px}
  .touch button.active{transform:scale(.94);filter:brightness(1.25)}
  @media (pointer:coarse){.touch:not(.off){display:flex}}

  #errBox{position:fixed;top:8px;left:8px;right:8px;z-index:9999;
    background:#c0392b;color:#fff;padding:10px 14px;border-radius:8px;
    font-family:monospace;font-size:12px;white-space:pre-wrap;display:none}

  @media (max-width:760px){
    .hub-stats{display:none}
    .hub-title{top:70px}
    .panel.wide{padding:18px 14px}
    .res-row{gap:12px;font-size:13px}
    .upg-row{flex-wrap:wrap;gap:8px}
    .upg-pips{order:3}
    .upg-action{order:4;margin-left:auto}
    .hub-actions{gap:6px}
    .hub-actions button{padding:10px 14px;font-size:11px}
    .hub-actions button.big{padding:11px 26px;font-size:12px}
  }
</style>
</head>
<body>
<div id="app">
  <canvas id="game"></canvas>

  <div id="hub" class="overlay hidden">
    <div class="hub-top">
      <div class="chip">$ <span id="hubMoney">0</span></div>
      <div class="chip clan-chip no-clan" id="hubClan">БЕЗ КЛАНА</div>
      <div class="chip best">РЕКОРД <b id="hubBest">—</b></div>
    </div>
    <div class="hub-title">
      <div class="car-name" id="hubCarName">—</div>

    </div>

/* ============ СОХРАНЕНИЕ ============ */
const SAVE_KEY = 'dragrace_save_v3';
let save = null;

function defaultSave(){
  return {
    money:600, ownedCars:['hatch'], currentCar:'hatch',
    upgrades:{}, best:null,
    clan:null, clanPoints:0,
    difficulty:'normal',
    tournamentCompletions:{},
    cosmetic:{}, cosmeticOwned:{ paints:[], rims:[], decals:[], neons:[] },
    districts:{}
  };
}
function loadSave(){
  try {
    const raw = localStorage.getItem(SAVE_KEY);
    if (raw) save = JSON.parse(raw);
  } catch(e){ save = null; }
  if (!save || typeof save !== 'object') save = defaultSave();

  if (!Array.isArray(save.ownedCars) || !save.ownedCars.length) save.ownedCars = ['hatch'];
  if (!save.upgrades || typeof save.upgrades !== 'object') save.upgrades = {};
  for (const c of CARS){
    const u = save.upgrades[c.id];
    if (!u || typeof u !== 'object') save.upgrades[c.id] = {engine:0,turbo:0,tires:0,weight:0};
    else for (const k of Object.keys(ZERO_UPG))
      if (typeof u[k] !== 'number') u[k] = 0;
  }
  if (typeof save.money !== 'number' || !isFinite(save.money)) save.money = 600;
  if (!save.ownedCars.includes(save.currentCar)) save.currentCar = save.ownedCars[0];
  if (save.clan === undefined) save.clan = null;
  if (typeof save.clanPoints !== 'number') save.clanPoints = 0;
  if (!save.difficulty || !DIFFICULTIES[save.difficulty]) save.difficulty = 'normal';
  if (!save.tournamentCompletions || typeof save.tournamentCompletions !== 'object')
    save.tournamentCompletions = {};

  // Cosmetic
  if (!save.cosmetic || typeof save.cosmetic !== 'object') save.cosmetic = {};
  if (!save.cosmeticOwned || typeof save.cosmeticOwned !== 'object')
    save.cosmeticOwned = { paints:[], rims:[], decals:[], neons:[] };
  for (const k of ['paints','rims','decals','neons'])
    if (!Array.isArray(save.cosmeticOwned[k])) save.cosmeticOwned[k] = [];
  for (const c of CARS){
    if (!save.cosmetic[c.id] || typeof save.cosmetic[c.id] !== 'object')
      save.cosmetic[c.id] = {};
    const co = save.cosmetic[c.id];
    if (!co.paint) co.paint = 'stock';
    if (!co.rim) co.rim = 'silver';
    if (!co.decal) co.decal = 'none';
    if (!co.neon) co.neon = 'none';
  }

  // Districts
  if (!save.districts || typeof save.districts !== 'object') save.districts = {};
  DISTRICTS.forEach((d, i) => {
    if (!save.districts[d.id]) save.districts[d.id] = CLANS[i % CLANS.length].id;
  });
}

/* ============ ХЕЛПЕРЫ ============ */
function getCarSpec(id){ return CARS.find(c => c.id === id) || CARS[0]; }
function computeAccel(spec, up){
  const power  = spec.power  + (up.engine||0)*0.06 + (up.turbo||0)*0.05;
  const weight = spec.weight - (up.weight||0)*0.04;
  return (power / Math.max(0.3, weight)) * 1.22;
}
function getStats(carId){
  const spec = getCarSpec(carId);
  const up   = save.upgrades[carId] || ZERO_UPG;
  const power  = spec.power  + up.engine*0.06 + up.turbo*0.05;
  const weight = spec.weight - up.weight*0.04;
  const grip   = spec.grip   + up.tires*0.06;
  return { power, weight, grip, accelMult: computeAccel(spec, up) };
}
function upgradeCost(upg, lvl){ return Math.round(upg.baseCost * Math.pow(upg.costMul, lvl)); }
function fmtMoney(n){ return Math.round(n).toString().replace(/\B(?=(\d{3})+(?!\d))/g, ' '); }
const clamp01 = v => Math.max(0, Math.min(1, v));

function getClanBonus(){
  if (!save.clan) return { money:1, power:1, grip:1 };
  const clan = CLANS.find(c => c.id === save.clan);
  if (!clan) return { money:1, power:1, grip:1 };
  return {
    money: clan.mods.money || 1,
    power: clan.mods.power || 1,
    grip:  clan.mods.grip  || 1
  };
}
function getTerritoryBonus(){
  const result = { money:1, power:1, grip:1 };
  if (!save.clan) return result;
  for (const d of DISTRICTS){
    if (save.districts[d.id] === save.clan){
      if (d.bonusType === 'money') result.money += d.bonusVal;
      if (d.bonusType === 'power') result.power += d.bonusVal;
      if (d.bonusType === 'grip')  result.grip  += d.bonusVal;
    }
  }
  return result;
}
function getDiffCfg(id){ return DIFFICULTIES[id] || DIFFICULTIES.normal; }

/* ============ ЦВЕТА ============ */
function hexToRgb(h){
  h = h.replace('#','');
  if (h.length === 3) h = h[0]+h[0]+h[1]+h[1]+h[2]+h[2];
  return { r: parseInt(h.substr(0,2),16), g: parseInt(h.substr(2,2),16), b: parseInt(h.substr(4,2),16) };
}
function rgbToHex(r,g,b){
  const f = v => Math.max(0,Math.min(255,Math.round(v))).toString(16).padStart(2,'0');
  return '#' + f(r) + f(g) + f(b);
}
function lighten(hex, amt){
  const c = hexToRgb(hex);
  return rgbToHex(c.r + (255-c.r)*amt, c.g + (255-c.g)*amt, c.b + (255-c.b)*amt);
}
function darken(hex, amt){
  const c = hexToRgb(hex);
  return rgbToHex(c.r*(1-amt), c.g*(1-amt), c.b*(1-amt));
}
function deriveColors(mainHex, original){
  return {
    main: mainHex,
    top: lighten(mainHex, 0.4),
    dark: darken(mainHex, 0.55),
    rim: original.rim
  };
}

/* ============ КОСМЕТИКА — ЛОГИКА ============ */
function cosmeticList(type){
  return type === 'paints' ? PAINTS : type === 'rims' ? RIM_COLORS : type === 'decals' ? DECALS : NEONS;
}
function isCosmeticOwned(type, id){
  const all = cosmeticList(type);
  const item = all.find(x => x.id === id);
  if (!item) return false;
  if (!item.cost) return true;
  return (save.cosmeticOwned[type] || []).includes(id);
}
function buyCosmetic(type, id){
  const all = cosmeticList(type);
  const item = all.find(x => x.id === id);
  if (!item || isCosmeticOwned(type, id)) return true;
  const cost = item.cost || 0;
  if (save.money < cost) return false;
  save.money -= cost;
  if (!save.cosmeticOwned[type]) save.cosmeticOwned[type] = [];
  save.cosmeticOwned[type].push(id);
  persist();
  return true;
}
function applyCosmetic(type, id){
  const carId = save.currentCar;
  if (!save.cosmetic[carId]) save.cosmetic[carId] = { paint:'stock', rim:'silver', decal:'none', neon:'none' };
  const key = type === 'paints' ? 'paint' : type === 'rims' ? 'rim' : type === 'decals' ? 'decal' : 'neon';
  if (!isCosmeticOwned(type, id)) return;
  save.cosmetic[carId][key] = id;
  persist();
}
function getCosmeticFor(carId){
  return save.cosmetic[carId] || { paint:'stock', rim:'silver', decal:'none', neon:'none' };
}

/* ============ ФИЗИКА ============ */
const QUARTER = 402.336;
const GEARS = [3.55, 2.15, 1.55, 1.20, 0.98];
const MAX_RPM = 7800, IDLE_RPM = 900, RPM_K = 122.4;
const POWER = 2.9, DRAG = 0.00055, PERFECT = 7100, SHIFT_T = 0.16;

function torqueAt(x){
  if (x < 0.08) return 0.32;
  if (x > 1) x = 1;
  let t = 1 - 1.6 * Math.pow(x - 0.72, 2);
  if (x > 0.92) t -= (x - 0.92) * 8;
  return Math.max(0.04, t);
}
function stepCar(car, dt, throttle){
  if (car.shiftTimer > 0) car.shiftTimer = Math.max(0, car.shiftTimer - dt);
  if (car.boostTimer > 0) car.boostTimer = Math.max(0, car.boostTimer - dt);
  if (car.flashTimer > 0) car.flashTimer = Math.max(0, car.flashTimer - dt);
  const rpmCalc = car.speed * GEARS[car.gear] * RPM_K;
  let rpm = rpmCalc;
  if (car.gear === 0 && throttle && rpm < 3300) rpm = 3300;
  if (rpm < IDLE_RPM) rpm = IDLE_RPM;
  let limiter = false;
  if (rpm >= MAX_RPM){ rpm = MAX_RPM; limiter = true; }
  let a = 0;
  if (throttle && car.shiftTimer <= 0 && !limiter){
    let tq = torqueAt(rpm / MAX_RPM);
    if (car.boostTimer > 0) tq *= 1.22;
    const launchBlend = Math.max(0, 1 - car.speed / 25);
    const gripMult = 1 + ((0.55 + 0.45 * car.grip) - 1) * launchBlend;
    a = tq * GEARS[car.gear] * POWER * car.accelMult * gripMult;
  }
  a -= DRAG * car.speed * car.speed;
  if (car.speed > 0.1) a -= 0.25;
  car.speed = Math.max(0, car.speed + a * dt);
  car.dist += car.speed * dt;
  car.rpm = rpm;
  car.limiter = limiter;
  car.wheelAngle += car.speed * dt * 2.4;
}
function shiftUp(car){
  if (car.gear >= GEARS.length - 1 || car.shiftTimer > 0) return;
  const at = car.rpm;
  car.gear++; car.shiftTimer = SHIFT_T;
  if (at >= PERFECT && at < MAX_RPM){
    car.boostTimer = 0.7; car.flashTimer = 0.7;
    car.perfectCount = (car.perfectCount || 0) + 1;
    beep(880, 0.07, 0.09);
  } else beep(220, 0.05, 0.05);
}

function resetRace(opts){
  opts = opts || {};
  const playerSpec = getCarSpec(save.currentCar);
  const pStats = getStats(save.currentCar);
  const pUpg   = save.upgrades[save.currentCar] || ZERO_UPG;
  const clanBonus = getClanBonus();
  const terrBonus = getTerritoryBonus();

  let oppSpec;
  if (opts.opponentCar){
    oppSpec = getCarSpec(opts.opponentCar);
  } else {
    const others = CARS.filter(c => c.id !== save.currentCar);
    oppSpec = others.length ? others[Math.floor(Math.random() * others.length)] : CARS[0];
  }
  const diffId = opts.difficulty || save.difficulty;
  const diffCfg = getDiffCfg(diffId);

  const totalUpg = Object.values(pUpg).reduce((a,b) => a+b, 0);
  let pool = Math.min(15, Math.floor(totalUpg / 3) + Math.floor(Math.random() * 5));
  const oppUpg = {engine:0, turbo:0, tires:0, weight:0};
  const keys = ['engine','turbo','tires','weight'];
  while (pool > 0){
    const idx = Math.floor(Math.random() * 4);
    if (oppUpg[keys[idx]] < 5){ oppUpg[keys[idx]]++; pool--; }
    if (Object.values(oppUpg).every(l => l >= 5)) break;
  }
  const oppStats = {
    accelMult: computeAccel(oppSpec, oppUpg),
    grip: oppSpec.grip + oppUpg.tires * 0.06
  };

  const stockAccel = computeAccel(playerSpec, ZERO_UPG);
  const aiBase = stockAccel + (pStats.accelMult - stockAccel) * 0.4;
  const aiVar  = 0.94 + Math.random() * 0.08;

  const pAccel = pStats.accelMult * clanBonus.power * (1 + terrBonus.power);
  const pGrip  = pStats.grip * clanBonus.grip * (1 + terrBonus.grip);
  const clanObj = save.clan ? CLANS.find(c => c.id === save.clan) : null;

  player = {
    dist:0, speed:0, rpm:IDLE_RPM, gear:0,
    shiftTimer:0, boostTimer:0, flashTimer:0, limiter:false,
    wheelAngle:0,
    accelMult:pAccel, grip:pGrip,
    colors:playerSpec.colors,
    cosmetic: getCosmeticFor(save.currentCar),
    visualUpg:{engine:pUpg.engine, turbo:pUpg.turbo, tires:pUpg.tires, weight:pUpg.weight},
    clanTag: clanObj ? clanObj.tag : null,
    clanColor: clanObj ? clanObj.color : null,
    finished:false, finishTime:0, perfectCount:0
  };
  opp = {
    dist:0, speed:0, rpm:IDLE_RPM, gear:0,
    shiftTimer:0, boostTimer:0, flashTimer:0, limiter:false,
    wheelAngle:0,
    accelMult: aiBase * aiVar * diffCfg.aiMult,
    grip: Math.min(1.6, oppStats.grip * (0.94 + Math.random() * 0.1) * Math.sqrt(diffCfg.aiMult)),
    colors:oppSpec.colors,
    cosmetic: null,
    visualUpg:oppUpg,
    finished:false, finishTime:0, perfectCount:0,
    shiftPoint:7150 + Math.random() * 400
  };
  state.raceTime = 0;
  state.afterPlayer = 0;
  state.countdown = 3.0;
  state.lastRaceOpts = opts;
}

/* ============ ЗВУК ============ */
let audioCtx = null, engineOsc = null, engineOsc2 = null;
let engineGain = null, engineFilter = null;
function initAudio(){
  if (audioCtx) return;
  try{
    audioCtx = new (window.AudioContext || window.webkitAudioContext)();
    engineFilter = audioCtx.createBiquadFilter();
    engineFilter.type = 'lowpass';
    engineFilter.frequency.value = 900; engineFilter.Q.value = 3;
    engineGain = audioCtx.createGain(); engineGain.gain.value = 0;
    engineOsc = audioCtx.createOscillator(); engineOsc.type = 'sawtooth'; engineOsc.frequency.value = 40;
    engineOsc2 = audioCtx.createOscillator(); engineOsc2.type = 'square'; engineOsc2.frequency.value = 20;
    const g2 = audioCtx.createGain(); g2.gain.value = 0.35;
    engineOsc.connect(engineFilter);
    engineOsc2.connect(g2).connect(engineFilter);
    engineFilter.connect(engineGain).connect(audioCtx.destination);
    engineOsc.start(); engineOsc2.start();
  }catch(e){ audioCtx = null; }
}
function beep(freq, dur, vol){
  if (!audioCtx) return;
  const o = audioCtx.createOscillator(); const g = audioCtx.createGain();
  o.type = 'square'; o.frequency.value = freq;
  g.gain.setValueAtTime(vol, audioCtx.currentTime);
  g.gain.exponentialRampToValueAtTime(0.0001, audioCtx.currentTime + dur);
  o.connect(g).connect(audioCtx.destination);
  o.start(); o.stop(audioCtx.currentTime + dur);
}
function updateEngineSound(){
  if (!audioCtx) return;
  const now = audioCtx.currentTime;
  const rpm = player ? player.rpm : IDLE_RPM;
  const f = 26 + (rpm / MAX_RPM) * 115;
  engineOsc.frequency.setTargetAtTime(f, now, 0.02);
  engineOsc2.frequency.setTargetAtTime(f * 0.5, now, 0.02);
  engineFilter.frequency.setTargetAtTime(400 + (rpm / MAX_RPM) * 2200, now, 0.05);
  const on = (state.phase === 'racing' || state.phase === 'countdown');
  engineGain.gain.setTargetAtTime(on ? 0.055 : 0, now, 0.06);
}

        btn.innerHTML = '<span class="swatch" style="background:' + (color || 'transparent') + '"></span>';
      }
      btn.title = item.name;
      btn.onclick = () => {
        if (!isCosmeticOwned(type, item.id)){
          if (!buyCosmetic(type, item.id)){ beep(220,0.1,0.1); return; }
        }
        applyCosmetic(type, item.id);
        beep(660,0.06,0.06);
        renderStyling();
        updateHubUI();
      };
      opts.appendChild(btn);
    }
    return wrap;
  }

  sections.appendChild(makeSection('ЦВЕТ КУЗОВА', 'paints', PAINTS, cos.paint, p => p.color || spec.colors.main, false));
  sections.appendChild(makeSection('ЦВЕТ ДИСКОВ', 'rims', RIM_COLORS, cos.rim, r => r.color, false));
  sections.appendChild(makeSection('НАКЛЕЙКИ', 'decals', DECALS, cos.decal, null, true));
  sections.appendChild(makeSection('НЕОН', 'neons', NEONS, cos.neon, n => n.color || null, false));
}

    const defPips = '●'.repeat(d.defense) + '○'.repeat(3 - d.defense);

    tile.innerHTML =
      '<div class="d-name">' + d.name + '</div>' +

        : '<div class="d-owner" style="background:rgba(120,120,120,.2);color:#8fa2c9">НЕЙТРАЛ</div>') +

      (canAttack ? '<div class="d-attack">АТАКА</div>' : (isMine ? '<div class="d-mine">ВАШЕ</div>' : ''));

function attackDistrict(districtId){
  const d = DISTRICTS.find(x => x.id === districtId);
  if (!d) return;
  if (!save.clan){ beep(220, 0.1, 0.1); return; }
  if (save.districts[d.id] === save.clan) return;

  const fee = 300 * d.defense;
  if (save.money < fee){ beep(220, 0.1, 0.1); return; }
  save.money -= fee;
  persist();

  startRace({
    opponentCar: d.oppCar,
    difficulty: d.oppDiff,
    districtAttack: { districtId: d.id }
  });
  beep(660, 0.1, 0.1);
}

/* ============ ТУРНИРЫ ============ */
function isTournamentUnlocked(t){
  if (t.requires){
    const prev = TOURNAMENTS.find(x => x.id === t.requires);
    if (prev && !save.tournamentCompletions[prev.id]) return false;
  }
  const tier = Math.max(0, CARS.findIndex(c => c.id === save.currentCar));
  return tier >= (t.minTier || 0);
}

  const list = document.getElementById('tournList');
  list.innerHTML = '';

    card.innerHTML =
      '<h3>'+t.name+' '+(completed>0?'<span class="tag done-tag">'+completed+'x</span>':'')+'</h3>' +

function startTournament(id){
  const t = TOURNAMENTS.find(x => x.id === id);
  if (!t) return;
  if (!isTournamentUnlocked(t)) return;
  if (save.money < t.entry) return;
  save.money -= t.entry;
  persist();
  const tournamentState = { id: t.id, currentRace: 0 };
  startTournamentRace(tournamentState);
  beep(660, 0.1, 0.1);
}

function startTournamentRace(tournamentState){
  const t = TOURNAMENTS.find(x => x.id === tournamentState.id);
  if (!t) return;
  const race = t.races[tournamentState.currentRace];
  if (!race) return;
  startRace({
    opponentCar: race.car,
    difficulty: race.diff,
    tournament: tournamentState
  });
}

/* ============ ЗАВЕРШЕНИЕ ============ */
function finishRace(){
  setPhase('finished');
  const won = opp.finished ? player.finishTime <= opp.finishTime : true;
  const perfect = player.perfectCount || 0;
  const tier = Math.max(0, CARS.findIndex(c => c.id === save.currentCar));

  const baseEarn = won ? (400 + tier * 80 + perfect * 60) : (80 + perfect * 30);
  const clanBonus = getClanBonus();
  const terrBonus = getTerritoryBonus();
  const diffId = (state.lastRaceOpts && state.lastRaceOpts.difficulty) || save.difficulty;
  const diffCfg = getDiffCfg(diffId);

  let earn = Math.round(baseEarn * diffCfg.rewardMult * clanBonus.money * terrBonus.money);
  let isBest = false;
  if (won && (!save.best || player.finishTime < save.best)){
    save.best = player.finishTime;
    isBest = true;
    earn += 200;
  }

  if (save.clan) save.clanPoints = (save.clanPoints || 0) + (won ? 50 + perfect * 15 : 10);

  // Tournament
  let tournamentResult = null;
  if (state.tournament){
    const t = TOURNAMENTS.find(x => x.id === state.tournament.id);
    if (t){
      if (won){
        state.tournament.currentRace++;
        if (state.tournament.currentRace >= t.races.length){
          const prevCount = save.tournamentCompletions[t.id] || 0;
          const prize = prevCount === 0 ? t.prize : Math.floor(t.prize / 2);
          earn += prize;
          save.tournamentCompletions[t.id] = prevCount + 1;
          tournamentResult = { type:'complete', id:t.id, name:t.name, prize };
          state.tournament = null;
        } else {
          tournamentResult = {
            type:'advance', id:t.id, name:t.name,
            currentRace: state.tournament.currentRace,
            totalRaces: t.races.length
          };
        }
      } else {
        tournamentResult = {
          type:'failed', id:t.id, name:t.name,
          currentRace: state.tournament.currentRace,
          totalRaces: t.races.length
        };
        state.tournament = null;
      }
    }
  }

  // District attack
  let districtResult = null;
  if (state.districtAttack){
    const d = DISTRICTS.find(x => x.id === state.districtAttack.districtId);
    if (d){
      if (won){
        const prevOwnerId = save.districts[d.id];
        const prevOwner = CLANS.find(c => c.id === prevOwnerId);
        save.districts[d.id] = save.clan;
        const captureBonus = 500 * d.defense;
        earn += captureBonus;
        districtResult = { district: d, success: true, prevOwner, captureBonus };
      } else {
        districtResult = { district: d, success: false };
      }
    }
    state.districtAttack = null;
  }

  save.money += earn;
  persist();

  state.lastResult = {
    won, pTime:player.finishTime,
    oTime:opp.finished ? opp.finishTime : null,
    perfect, earn, isBest,
    diff: diffId,
    clanBonus: clanBonus.money,
    terrBonus: terrBonus.money,
    tournamentResult, districtResult
  };
  showResults();
}

/* ============ AI + UPDATE ============ */
function updateAI(dt){
  if (opp.shiftTimer <= 0 && opp.gear < GEARS.length - 1){
    const rc = opp.speed * GEARS[opp.gear] * RPM_K;
    if (rc >= opp.shiftPoint){
      opp.gear++; opp.shiftTimer = 0.14;
      opp.shiftPoint = 7200 + Math.random() * 420;
    }
  }
  stepCar(opp, dt, true);
}
function update(dt){
  if (state.phase === 'countdown'){
    const prev = Math.ceil(state.countdown);
    state.countdown -= dt;
    const now = Math.ceil(state.countdown);
    if (now !== prev && now >= 1) beep(440, 0.12, 0.09);
    if (state.countdown <= 0){
      state.phase = 'racing'; state.raceTime = 0;
      beep(880, 0.3, 0.14);
    }
    return;
  }
  if (state.phase !== 'racing') return;
  if (!player || !opp) return;
  state.raceTime += dt;
  stepCar(player, dt, input.gas);
  updateAI(dt);
  if (!player.finished && player.dist >= QUARTER){
    player.finished = true; player.finishTime = state.raceTime;
  }
  if (!opp.finished && opp.dist >= QUARTER){
    opp.finished = true; opp.finishTime = state.raceTime;
  }
  if (player.finished) state.afterPlayer += dt;
  if (player.finished && (opp.finished || state.afterPlayer > 4)) finishRace();
}

/* ============ КОЛЕСО ============ */
function drawDetailedWheel(g, x, y, r, angle, level, rimColor){
  g.save(); g.translate(x, y);
  const tireGrad = g.createRadialGradient(-r*0.2, -r*0.25, r*0.25, 0, 0, r);
  tireGrad.addColorStop(0,'#2a2a32'); tireGrad.addColorStop(0.65,'#121218');
  tireGrad.addColorStop(1,'#050508');
  g.fillStyle = tireGrad;
  g.beginPath(); g.arc(0,0,r,0,Math.PI*2); g.fill();
  g.strokeStyle = 'rgba(50,50,60,.55)'; g.lineWidth = 0.6;
  for (let i = 0; i < 22; i++){
    const a = i*Math.PI/11 + angle*0.4;
    g.beginPath();
    g.moveTo(Math.cos(a)*r*0.87, Math.sin(a)*r*0.87);
    g.lineTo(Math.cos(a)*r*0.965, Math.sin(a)*r*0.965);
    g.stroke();
  }
  g.strokeStyle = 'rgba(85,85,95,.4)'; g.lineWidth = 0.5;
  g.beginPath(); g.arc(0,0,r*0.83,0,Math.PI*2); g.stroke();
  g.rotate(angle);
  const rimR = r * (0.66 + level * 0.012);
  const rimGrad = g.createRadialGradient(-rimR*0.2, -rimR*0.3, rimR*0.1, 0,0,rimR);
  rimGrad.addColorStop(0, '#f2f6ff');
  rimGrad.addColorStop(0.4, rimColor);
  rimGrad.addColorStop(1, darken(rimColor, 0.55));
  g.fillStyle = rimGrad;
  g.beginPath(); g.arc(0,0,rimR,0,Math.PI*2); g.fill();
  g.strokeStyle = 'rgba(30,30,40,.8)'; g.lineWidth = 1;
  g.beginPath(); g.arc(0,0,rimR,0,Math.PI*2); g.stroke();
  const spokeCount = 5 + Math.floor(level / 2) * 2;
  for (let i = 0; i < spokeCount; i++){
    const a = i*Math.PI*2/spokeCount;
    g.save(); g.rotate(a);
    const sg = g.createLinearGradient(0, -rimR*0.15, 0, -rimR*0.85);
    sg.addColorStop(0, darken(rimColor, 0.35));
    sg.addColorStop(0.5, rimColor);
    sg.addColorStop(1, lighten(rimColor, 0.35));
    g.fillStyle = sg;
    if (level >= 3){
      g.beginPath();
      g.moveTo(-3,-rimR*0.16); g.lineTo(-2.2,-rimR*0.82);
      g.lineTo(-0.8,-rimR*0.82); g.lineTo(-0.6,-rimR*0.16);
      g.closePath(); g.fill();
      g.beginPath();
      g.moveTo(3,-rimR*0.16); g.lineTo(2.2,-rimR*0.82);
      g.lineTo(0.8,-rimR*0.82); g.lineTo(0.6,-rimR*0.16);
      g.closePath(); g.fill();
    } else {
      g.beginPath();
      g.moveTo(-2.5,-rimR*0.16); g.lineTo(-1.6,-rimR*0.82);
      g.lineTo(1.6,-rimR*0.82); g.lineTo(2.5,-rimR*0.16);
      g.closePath(); g.fill();
    }
    g.restore();
  }
  g.fillStyle = '#1a2030';
  g.beginPath(); g.arc(0,0,rimR*0.28,0,Math.PI*2); g.fill();
  for (let i = 0; i < 5; i++){
    const a = i*Math.PI*2/5;
    g.fillStyle = '#c8d0e0';
    g.beginPath();
    g.arc(Math.cos(a)*rimR*0.2, Math.sin(a)*rimR*0.2, rimR*0.035, 0, Math.PI*2);
    g.fill();
  }
  const capGrad = g.createRadialGradient(-rimR*0.04, -rimR*0.05, 0, 0,0,rimR*0.13);
  capGrad.addColorStop(0,'#ffffff'); capGrad.addColorStop(1, rimColor);
  g.fillStyle = capGrad;
  g.beginPath(); g.arc(0,0,rimR*0.13,0,Math.PI*2); g.fill();
  g.restore();
}

/* ============ ДЕКАЛИ ============ */
function drawDecal(g, decal, colors){
  if (decal === 'stripes'){
    g.fillStyle = 'rgba(255,255,255,.92)';
    g.fillRect(-62, -32, 130, 4);
    g.fillRect(-62, -26, 130, 4);
  } else if (decal === 'checker'){
    for (let i = 0; i < 13; i++){
      g.fillStyle = i % 2 ? '#f8f8f8' : '#111';
      g.fillRect(-62 + i*10, -34, 10, 7);
    }
  } else if (decal === 'sponsor'){
    g.fillStyle = 'rgba(255,255,255,.92)';
    g.fillRect(-42, -32, 22, 8);
    g.fillRect(-14, -32, 18, 8);
    g.fillRect(12, -32, 26, 8);
    g.fillStyle = '#111';
    g.font = 'bold 5px sans-serif';
    g.textAlign = 'center';
    g.fillText('TURBO', -31, -25);
    g.fillText('RACE', -5, -25);
    g.fillText('DRAG', 25, -25);
  } else if (decal === 'flames'){
    const grd = g.createLinearGradient(0, -50, 65, -20);
    grd.addColorStop(0, 'rgba(255,180,0,.85)');
    grd.addColorStop(1, 'rgba(255,60,0,.9)');
    g.fillStyle = grd;
    for (let i = 0; i < 5; i++){
      g.beginPath();
      g.moveTo(15 + i*2, -48 + i*4);
      g.quadraticCurveTo(40 + i*3, -54 + i*3, 60, -46 + i*4);
      g.quadraticCurveTo(45 + i*3, -42 + i*3, 15 + i*2, -44 + i*4);
      g.closePath();
      g.fill();
    }
  } else if (decal === 'tribal'){
    g.strokeStyle = 'rgba(0,0,0,.82)';
    g.lineWidth = 2.2;
    g.lineCap = 'round';
    for (let i = 0; i < 4; i++){
      g.beginPath();
      g.moveTo(-52 + i*26, -44);
      g.quadraticCurveTo(-42 + i*26, -32, -52 + i*26, -20);
      g.stroke();
      g.beginPath();
      g.moveTo(-48 + i*26, -44);
      g.quadraticCurveTo(-40 + i*26, -34, -48 + i*26, -24);
      g.stroke();
    }
  }
}

/* ============ МАШИНА ============ */
function drawCar(g, x, y, s, wheelAngle, colors, boost, flash, upg, clanTag, cosmetic){
  const u = upg || ZERO_UPG;
  const cos = cosmetic || { paint:'stock', rim:'silver', decal:'none', neon:'none' };
  const eLvl = u.engine || 0;
  const tLvl = u.turbo  || 0;
  const tiLvl = u.tires || 0;
  const wLvl = u.weight || 0;
  const rideDrop = wLvl * 1.35;

  // Compute effective colors from cosmetic
  let effColors = colors;
  if (cos.paint && cos.paint !== 'stock'){
    const paintOpt = PAINTS.find(p => p.id === cos.paint);
    if (paintOpt && paintOpt.color) effColors = deriveColors(paintOpt.color, colors);
  }
  let rimColor = effColors.rim;
  if (cos.rim && cos.rim !== 'silver'){
    const rimOpt = RIM_COLORS.find(r => r.id === cos.rim);
    if (rimOpt) rimColor = rimOpt.color;
  }
  const neonOpt = cos.neon && cos.neon !== 'none' ? NEONS.find(n => n.id === cos.neon) : null;

  g.save();
  g.translate(x, y);
  g.scale(s, s);

  // Neon glow
  if (neonOpt && neonOpt.color){
    const nc = neonOpt.color;
    const gl = g.createRadialGradient(0, -5, 5, 0, -5, 110);
    gl.addColorStop(0, nc + 'aa');
    gl.addColorStop(0.55, nc + '44');
    gl.addColorStop(1, nc + '00');
    g.fillStyle = gl;
    g.beginPath(); g.ellipse(0, -2, 95, 22, 0, 0, Math.PI*2); g.fill();
  }

  // Shadow
  const shadowGrad = g.createRadialGradient(0,5,12,0,5,100);
  shadowGrad.addColorStop(0,'rgba(0,0,0,.55)');
  shadowGrad.addColorStop(0.6,'rgba(0,0,0,.2)');
  shadowGrad.addColorStop(1,'rgba(0,0,0,0)');
  g.fillStyle = shadowGrad;
  g.beginPath(); g.ellipse(0,5,100,12,0,0,Math.PI*2); g.fill();

  const wheelR = 15 + tiLvl * 0.65;
  const wheelY = -wheelR;
  drawDetailedWheel(g, -38, wheelY, wheelR, wheelAngle, tiLvl, rimColor);
  drawDetailedWheel(g,  40, wheelY, wheelR, wheelAngle, tiLvl, rimColor);

  g.translate(0, rideDrop);

  // Exhaust flames
  const pipeCount = 1 + Math.floor(eLvl / 2);
  if (boost > 0){
    const fl = 0.6 + Math.random() * 0.5;
    for (let p = 0; p < pipeCount; p++){
      const py = -22 + p * 4;
      const flameLen = (40 + eLvl * 4) * fl;
      const flameG = g.createLinearGradient(-67, py, -67 - flameLen, py);
      flameG.addColorStop(0,'rgba(255,250,200,.95)');
      flameG.addColorStop(0.25,'rgba(255,200,60,.9)');
      flameG.addColorStop(0.55,'rgba(255,100,20,.55)');
      flameG.addColorStop(1,'rgba(255,40,0,0)');
      g.fillStyle = flameG;
      g.beginPath();
      g.moveTo(-67, py-2.5);
      g.quadraticCurveTo(-67-flameLen*0.5, py-5-Math.random()*3,
                         -67-flameLen, py+(Math.random()-0.5)*4);
      g.quadraticCurveTo(-67-flameLen*0.5, py+2+Math.random()*3,
                         -67, py+2.5);
      g.closePath(); g.fill();
    }
  }

  // Body
  const bodyPath = new Path2D();
  bodyPath.moveTo(-68,-16);
  bodyPath.lineTo(-68,-33);
  bodyPath.bezierCurveTo(-68,-38,-63,-40,-56,-40);
  bodyPath.lineTo(-36,-40);
  bodyPath.lineTo(-17,-58);
  bodyPath.bezierCurveTo(-15,-59,-12,-59,-10,-58);
  bodyPath.lineTo(12,-58);
  bodyPath.bezierCurveTo(14,-59,17,-59,19,-58);
  bodyPath.lineTo(36,-40);
  bodyPath.lineTo(57,-38);
  bodyPath.bezierCurveTo(64,-37,68,-32,68,-26);
  bodyPath.lineTo(68,-16);
  bodyPath.closePath();

  const bodyGrad = g.createLinearGradient(0,-60,0,-10);
  bodyGrad.addColorStop(0, effColors.top);
  bodyGrad.addColorStop(0.35, effColors.main);
  bodyGrad.addColorStop(0.85, effColors.dark);
  bodyGrad.addColorStop(1, '#050508');
  g.fillStyle = bodyGrad; g.fill(bodyPath);
  g.strokeStyle = 'rgba(0,0,0,.7)'; g.lineWidth = 1.5; g.stroke(bodyPath);

  // Decals
  if (cos.decal && cos.decal !== 'none'){
    g.save();
    g.clip(bodyPath);
    drawDecal(g, cos.decal, effColors);
    g.restore();
  }

  // Carbon hood / roof
  if (wLvl >= 2){
    g.save();
    const hp = new Path2D();
    hp.moveTo(-17,-58); hp.lineTo(-36,-40); hp.lineTo(36,-40); hp.lineTo(17,-58);
    hp.closePath(); g.clip(hp);
    g.fillStyle = 'rgba(20,20,26,.55)'; g.fillRect(-40,-60,80,25);
    g.strokeStyle = 'rgba(95,95,110,.32)'; g.lineWidth = 0.5;
    for (let cy=-58; cy<-38; cy+=2.5)
      for (let cx=-40; cx<40; cx+=5){
        g.beginPath(); g.moveTo(cx,cy); g.lineTo(cx+2.5,cy+2.5); g.stroke();
      }
    g.restore();
  }
  if (wLvl >= 4){
    g.save();
    const rp = new Path2D();
    rp.moveTo(-17,-58); rp.lineTo(17,-58); rp.lineTo(30,-42); rp.lineTo(-32,-42);
    rp.closePath(); g.clip(rp);
    g.fillStyle = 'rgba(20,20,26,.6)'; g.fillRect(-40,-60,80,25);
    g.strokeStyle = 'rgba(95,95,110,.3)'; g.lineWidth = 0.5;
    for (let cy=-58; cy<-40; cy+=2.5)
      for (let cx=-40; cx<40; cx+=5){
        g.beginPath(); g.moveTo(cx,cy); g.lineTo(cx+2.5,cy+2.5); g.stroke();
      }
    g.restore();
  }

  // Glass
  const glassPath = new Path2D();
  glassPath.moveTo(-30,-42); glassPath.lineTo(-15,-55);
  glassPath.lineTo(14,-55); glassPath.lineTo(30,-42);
  glassPath.closePath();
  const glassGrad = g.createLinearGradient(0,-56,0,-38);
  glassGrad.addColorStop(0,'rgba(200,230,255,.78)');
  glassGrad.addColorStop(0.4,'rgba(100,160,240,.85)');
  glassGrad.addColorStop(1,'rgba(15,30,60,.95)');
  g.fillStyle = glassGrad; g.fill(glassPath);
  g.strokeStyle = 'rgba(0,0,0,.6)'; g.lineWidth = 1.2;
  g.beginPath(); g.moveTo(0,-55); g.lineTo(0,-42); g.stroke();
  g.strokeStyle = 'rgba(255,255,255,.5)'; g.lineWidth = 1;
  g.beginPath(); g.moveTo(-24,-46); g.lineTo(-14,-54); g.stroke();

  // Door line
  g.strokeStyle = 'rgba(0,0,0,.4)'; g.lineWidth = 1;
  g.beginPath(); g.moveTo(0,-40); g.lineTo(0,-18); g.stroke();
  g.fillStyle = 'rgba(200,210,230,.75)'; g.fillRect(4,-33,8,2);

  // Mirror
  g.fillStyle = effColors.dark;
  g.beginPath(); g.moveTo(-30,-42); g.lineTo(-38,-46); g.lineTo(-38,-41);
  g.closePath(); g.fill();
  g.strokeStyle = 'rgba(0,0,0,.5)'; g.lineWidth = 0.8; g.stroke();

  // Headlight
  const headGrad = g.createRadialGradient(63,-30,1,63,-30,10);
  headGrad.addColorStop(0,'#fffbe6'); headGrad.addColorStop(0.4,'#ffe066');
  headGrad.addColorStop(1,'rgba(255,200,80,0)');
  g.fillStyle = headGrad;
  g.beginPath();
  g.moveTo(57,-31); g.lineTo(68,-30); g.lineTo(68,-24); g.lineTo(56,-25);
  g.closePath(); g.fill();
  g.fillStyle = '#fff5c0';
  g.beginPath();
  g.moveTo(61,-29); g.lineTo(66,-28.5); g.lineTo(66,-26); g.lineTo(60,-26);
  g.closePath(); g.fill();

  // Taillight
  g.fillStyle = 'rgba(255,60,60,.9)';
  g.beginPath();
  g.moveTo(-68,-27); g.lineTo(-62,-27); g.lineTo(-62,-20); g.lineTo(-68,-22);
  g.closePath(); g.fill();
  g.save(); g.shadowColor = '#ff3030'; g.shadowBlur = 10; g.fill(); g.restore();

  // Turbo hood scoop
  if (tLvl >= 1){
    const scoopH = 2.5 + tLvl * 0.9;
    const scoopW = 10 + tLvl * 1.2;
    const sx = 5, sy = -58;
    g.fillStyle = effColors.dark;
    g.beginPath();
    g.moveTo(sx, sy); g.lineTo(sx+scoopW, sy);
    g.lineTo(sx+scoopW+2, sy-scoopH); g.lineTo(sx-2, sy-scoopH);
    g.closePath(); g.fill();
    g.strokeStyle = 'rgba(0,0,0,.7)'; g.lineWidth = 1; g.stroke();
    g.fillStyle = 'rgba(15,15,20,.9)'; g.fillRect(sx+1, sy-1.5, scoopW-2, 1.5);
    g.strokeStyle = 'rgba(255,255,255,.4)'; g.lineWidth = 0.8;
    g.beginPath();
    g.moveTo(sx-2, sy-scoopH+0.5); g.lineTo(sx+scoopW+2, sy-scoopH+0.5);
    g.stroke();
  }
  if (tLvl >= 3){
    g.fillStyle = 'rgba(10,10,15,.9)';
    g.beginPath();
    g.moveTo(57,-22); g.lineTo(67,-21); g.lineTo(67,-17); g.lineTo(57,-18);
    g.closePath(); g.fill();
    g.strokeStyle = 'rgba(160,190,230,.7)'; g.lineWidth = 0.4;
    for (let i = 0; i < 4; i++){
      g.beginPath(); g.moveTo(58,-21+i*0.8); g.lineTo(66,-20.5+i*0.8); g.stroke();
    }
  }

  // Spoiler
  const spoilerLvl = Math.min(5, Math.floor((wLvl + eLvl) / 2));
  if (spoilerLvl > 0){
    const spH = 3 + spoilerLvl * 1.2;
    const spW = 16 + spoilerLvl * 2;
    const spY = -40 - spH;
    const wingHalf = spW / 2;
    g.fillStyle = effColors.dark;
    g.fillRect(-62,-42,2.5,spH-2); g.fillRect(-54,-42,2.5,spH-2);
    const wg = g.createLinearGradient(0, spY, 0, spY+5);
    wg.addColorStop(0, effColors.top); wg.addColorStop(1, effColors.dark);
    g.fillStyle = wg;
    g.beginPath();
    g.moveTo(-58-wingHalf, spY+2); g.lineTo(-58+wingHalf, spY+2);
    g.lineTo(-56+wingHalf, spY-3); g.lineTo(-60-wingHalf, spY-3);
    g.closePath(); g.fill();
    g.strokeStyle = 'rgba(0,0,0,.6)'; g.lineWidth = 1; g.stroke();
    g.strokeStyle = 'rgba(255,255,255,.5)'; g.lineWidth = 0.8;
    g.beginPath(); g.moveTo(-60-wingHalf, spY-2.5); g.lineTo(-56+wingHalf, spY-2.5); g.stroke();
  }

  // Side skirt
  if (wLvl >= 1){
    g.fillStyle = effColors.dark;
    g.fillRect(-30,-14,60,2+wLvl*0.4);
    g.strokeStyle = 'rgba(255,255,255,.15)'; g.lineWidth = 0.6;
    g.beginPath(); g.moveTo(-30,-14); g.lineTo(30,-14); g.stroke();
  }

  // Exhaust pipes
  for (let i = 0; i < pipeCount; i++){
    const py = -22 + i * 4;
    g.fillStyle = '#666';
    g.beginPath(); g.ellipse(-67, py, 2, 2.5, 0, 0, Math.PI*2); g.fill();
    g.fillStyle = '#111';
    g.beginPath(); g.ellipse(-67, py, 1.2, 1.5, 0, 0, Math.PI*2); g.fill();
  }

  // Highlights
  g.strokeStyle = 'rgba(255,255,255,.38)'; g.lineWidth = 1.5;
  g.beginPath(); g.moveTo(-56,-40); g.lineTo(-36,-40); g.stroke();
  g.beginPath(); g.moveTo(36,-40); g.lineTo(56,-38); g.stroke();
  g.strokeStyle = 'rgba(255,255,255,.22)'; g.lineWidth = 2;
  g.beginPath(); g.moveTo(-60,-22); g.lineTo(62,-22); g.stroke();

  // Clan tag
  if (clanTag){
    g.font = 'bold 7px monospace';
    g.textAlign = 'center';
    g.fillStyle = 'rgba(255,255,255,.85)';
    g.fillText(clanTag, 15, -25);
    g.strokeStyle = 'rgba(0,0,0,.5)'; g.lineWidth = 0.4;
    g.strokeText(clanTag, 15, -25);
  }

  // Perfect shift flash
  if (flash > 0){
    g.globalAlpha = flash;
    g.strokeStyle = '#4dffa0'; g.lineWidth = 3;
    g.shadowColor = '#4dffa0'; g.shadowBlur = 28;
    g.beginPath(); g.ellipse(0,-30,84,44,0,0,Math.PI*2); g.stroke();
    g.shadowBlur = 0; g.globalAlpha = 1;
  }

  g.restore();
}

/* ============ ХАБ — ШОУРУМ ============ */
const stars = [];
for (let i = 0; i < 160; i++)
  stars.push({ x:Math.random(), y:Math.random(), r:Math.random()*1.4+0.3, a:Math.random()*0.7+0.2 });
const buildings = [];
const BUILDING_SPAN = 7200;
for (let i = 0; i < 80; i++)
  buildings.push({ x:i*90 + Math.random()*50, w:34+Math.random()*56,
                   h:30+Math.random()*150, lit:Math.random() > 0.35 });

function hubCarTransform(){
  const s = Math.min(W/280, H/260);
  const floorY = H * 0.60;
  return { s, floorY, x: W/2 };
}
function updateHubParticles(dt){
  const { s, floorY, x } = hubCarTransform();
  const bob = Math.sin(performance.now()*0.0015) * 1.8;
  for (let i = hubParticles.length-1; i >= 0; i--){
    const p = hubParticles[i];
    p.life -= dt;
    if (p.life <= 0){ hubParticles.splice(i, 1); continue; }
    p.x += p.vx * dt; p.y += p.vy * dt;
    p.r += dt * 12; p.vy -= dt * 4;
  }
  if (Math.random() < 0.55){
    hubParticles.push({
      x: x - 67*s + (Math.random()-0.5)*10,
      y: floorY + bob - 18*s + (Math.random()-0.5)*6,
      vx: -14 - Math.random()*22, vy: -8 - Math.random()*14,
      r: 2.5 + Math.random()*4, life: 1.0 + Math.random()*0.9, maxLife: 1.9
    });
  }
}
function drawHub(t){
  const spec = getCarSpec(save.currentCar);
  const upg = save.upgrades[save.currentCar] || ZERO_UPG;
  const cos = getCosmeticFor(save.currentCar);
  const { s, floorY, x } = hubCarTransform();
  const bob = Math.sin(t*0.0015) * 1.8;
  const clanTag = save.clan ? (CLANS.find(c=>c.id===save.clan)||{}).tag : null;

  const bg = ctx.createRadialGradient(W/2, H*0.42, 40, W/2, H*0.42, Math.max(W,H)*0.9);
  bg.addColorStop(0,'#1c1838'); bg.addColorStop(0.5,'#0c0a1c'); bg.addColorStop(1,'#04040a');
  ctx.fillStyle = bg; ctx.fillRect(0,0,W,H);

  for (const st of stars){
    ctx.globalAlpha = st.a * (0.5 + 0.5*Math.sin(t*0.001 + st.x*30));
    ctx.fillStyle = '#dfe9ff';
    ctx.fillRect(st.x*W, st.y*floorY*0.8, st.r, st.r);
  }
  ctx.globalAlpha = 1;

  for (const lx of [W*0.2, W*0.8]){
    const lg = ctx.createLinearGradient(lx,0,lx,floorY);
    lg.addColorStop(0,'rgba(120,170,255,.16)'); lg.addColorStop(1,'rgba(120,170,255,0)');
    ctx.fillStyle = lg;
    ctx.beginPath();
    ctx.moveTo(lx-26,0); ctx.lineTo(lx+26,0);
    ctx.lineTo(lx+150,floorY); ctx.lineTo(lx-150,floorY);
    ctx.closePath(); ctx.fill();
  }

  const fg = ctx.createLinearGradient(0,floorY,0,H);
  fg.addColorStop(0,'#10122a'); fg.addColorStop(1,'#05060e');
  ctx.fillStyle = fg; ctx.fillRect(0,floorY,W,H-floorY);

  ctx.strokeStyle = 'rgba(90,130,220,.13)'; ctx.lineWidth = 1;
  for (let i = -12; i <= 12; i++){
    ctx.beginPath(); ctx.moveTo(W/2 + i*46, floorY); ctx.lineTo(W/2 + i*300, H); ctx.stroke();
  }
  for (let i = 1; i <= 9; i++){
    const yy = floorY + (H-floorY)*Math.pow(i/9,2);
    ctx.beginPath(); ctx.moveTo(0,yy); ctx.lineTo(W,yy); ctx.stroke();
  }

  const pulse = 0.5 + 0.5*Math.sin(t*0.002);
  const glowR = Math.min(W*0.5, 440);
  const rg = ctx.createRadialGradient(W/2, floorY, 8, W/2, floorY, glowR);
  rg.addColorStop(0, 'rgba(90,140,255,' + (0.17+pulse*0.1) + ')');
  rg.addColorStop(1, 'rgba(90,140,255,0)');
  ctx.fillStyle = rg;
  ctx.beginPath(); ctx.ellipse(W/2, floorY, glowR, glowR*0.22, 0, 0, Math.PI*2); ctx.fill();

  ctx.save();
  ctx.translate(W/2, floorY);
  ctx.rotate(t * 0.0006);
  ctx.strokeStyle = 'rgba(120,170,255,.3)'; ctx.lineWidth = 2;
  ctx.setLineDash([16,24]);
  ctx.beginPath(); ctx.ellipse(0,0,165*s,34*s,0,0,Math.PI*2); ctx.stroke();
  ctx.restore();

  const fog = ctx.createLinearGradient(0, floorY-60, 0, H);
  fog.addColorStop(0,'rgba(80,110,200,0)');
  fog.addColorStop(0.4,'rgba(80,110,200,.06)');
  fog.addColorStop(1,'rgba(80,110,200,.13)');
  ctx.fillStyle = fog; ctx.fillRect(0, floorY-60, W, H-floorY+60);

  // Reflection
  ctx.save();
  ctx.translate(0, floorY*2);
  ctx.scale(1, -1);
  ctx.globalAlpha = 0.16;
  drawCar(ctx, x, floorY, s, 0, spec.colors, 0, 0, upg, clanTag, cos);
  ctx.restore();

  for (const p of hubParticles){
    const a = Math.max(0, p.life / p.maxLife);
    ctx.globalAlpha = a * 0.32;
    ctx.fillStyle = '#9fb6e8';
    ctx.beginPath(); ctx.arc(p.x, p.y, p.r, 0, Math.PI*2); ctx.fill();
  }
  ctx.globalAlpha = 1;

  drawCar(ctx, x, floorY+bob, s, 0, spec.colors, 0, 0, upg, clanTag, cos);

  const sweep = (t * 0.00035) % 1;
  const sx = W/2 - 200*s + sweep * 400*s;
  const shine = ctx.createLinearGradient(sx-60, 0, sx+60, 0);
  shine.addColorStop(0,'rgba(255,255,255,0)');
  shine.addColorStop(0.5,'rgba(255,255,255,.11)');
  shine.addColorStop(1,'rgba(255,255,255,0)');
  ctx.fillStyle = shine;
  ctx.fillRect(sx-60, floorY-90*s, 120, 90*s);

  for (let i = 0; i < 14; i++){
    const ang = t*0.0004 + i*0.449;
    const rad = 150*s + Math.sin(t*0.002+i)*20;
    const px = W/2 + Math.cos(ang)*rad;
    const py = floorY - 45*s + Math.sin(ang*1.3)*45*s;
    const a = 0.18 + 0.18*Math.sin(t*0.003+i*2);
    ctx.globalAlpha = a;
    ctx.fillStyle = '#bfe0ff';
    ctx.beginPath(); ctx.arc(px, py, 1.6, 0, Math.PI*2); ctx.fill();
  }
  ctx.globalAlpha = 1;

  const vg = ctx.createRadialGradient(W/2,H/2,Math.min(W,H)*0.35, W/2,H/2,Math.max(W,H)*0.78);
  vg.addColorStop(0,'rgba(0,0,0,0)'); vg.addColorStop(1,'rgba(0,0,0,.62)');
  ctx.fillStyle = vg; ctx.fillRect(0,0,W,H);
}

/* ============ ФОН ЗАЕЗДА ============ */
function drawRace(){
  if (!player || !opp) return;
  const horizon = H * 0.44;
  const camDist = player.dist;
  const pxPerM  = Math.max(6, W / 95);
  const playerX = W * 0.30;

  let g = ctx.createLinearGradient(0, 0, 0, horizon);
  g.addColorStop(0,'#04050f');
  g.addColorStop(0.35,'#0f0c2c');
  g.addColorStop(0.65,'#2a1545');
  g.addColorStop(0.88,'#6d2546');
  g.addColorStop(1,'#a84a54');
  ctx.fillStyle = g; ctx.fillRect(0,0,W,horizon);

  for (const st of stars){
    ctx.globalAlpha = st.a * (0.5 + 0.5*Math.sin(performance.now()*0.001 + st.x*30));
    ctx.fillStyle = '#dfe9ff';
    ctx.fillRect(st.x*W, st.y*horizon*0.8, st.r, st.r);
  }
  ctx.globalAlpha = 1;

  const moonX = W*0.78, moonY = horizon*0.28;
  const mg = ctx.createRadialGradient(moonX,moonY,4,moonX,moonY,130);
  mg.addColorStop(0,'rgba(255,235,200,.35)'); mg.addColorStop(1,'rgba(255,235,200,0)');
  ctx.fillStyle = mg; ctx.fillRect(moonX-140, moonY-140, 280, 280);
  ctx.fillStyle = '#ffeccc';
  ctx.beginPath(); ctx.arc(moonX,moonY,26,0,Math.PI*2); ctx.fill();

  const off = (camDist * 8) % BUILDING_SPAN;
  for (const b of buildings){
    let bx = ((b.x - off) % BUILDING_SPAN + BUILDING_SPAN) % BUILDING_SPAN;
    if (bx > W + 160) continue;
    const by = horizon - b.h;
    ctx.fillStyle = '#0b0c1e'; ctx.fillRect(bx, by, b.w, b.h);
    if (b.lit){
      ctx.fillStyle = 'rgba(120,170,255,.22)';
      for (let wy = by+8; wy < horizon-8; wy += 14)
        for (let wx = bx+5; wx < bx+b.w-6; wx += 12)
          if (Math.random() > 0.55) ctx.fillRect(wx, wy, 4, 6);
    }
  }

  g = ctx.createLinearGradient(0, horizon, 0, H);
  g.addColorStop(0,'#15162a'); g.addColorStop(0.35,'#101120'); g.addColorStop(1,'#07080f');
  ctx.fillStyle = g; ctx.fillRect(0, horizon, W, H-horizon);

  const roadTop = horizon + 10;
  const roadBot = H - 18;

  const markStep = 25;
  const markStart = Math.floor(camDist / markStep) * markStep;
  ctx.font = '11px monospace'; ctx.textAlign = 'center';
  for (let m = markStart; m < camDist + 260; m += markStep){
    const mx = playerX + (m - camDist) * pxPerM;
    if (mx < -60 || mx > W+60) continue;
    if (m < 0) continue;
    if (Math.abs(m - Math.round(QUARTER)) < markStep/2) continue;
    ctx.strokeStyle = 'rgba(120,150,220,.10)'; ctx.lineWidth = 1;
    ctx.beginPath(); ctx.moveTo(mx, roadTop); ctx.lineTo(mx, roadBot); ctx.stroke();
    if (m % 50 === 0 && m > 0){
      ctx.fillStyle = 'rgba(140,170,220,.35)';
      ctx.fillText(m + ' м', mx, roadBot + 14);
    }
  }

  const blockM = 3;
  const bStart = Math.floor(camDist / blockM) * blockM;
  for (let m = bStart; m < camDist + 260; m += blockM){
    const bx = playerX + (m - camDist) * pxPerM;
    const wpx = blockM * pxPerM + 1;
    if (bx > W || bx + wpx < 0) continue;
    const idx = Math.round(m / blockM);
    ctx.fillStyle = (idx % 2) ? 'rgba(230,230,240,.55)' : 'rgba(200,45,60,.65)';
    ctx.fillRect(bx, roadBot+2, wpx, 8);
  }

  const laneFarY  = roadTop + (roadBot - roadTop) * 0.34;
  const laneNearY = roadTop + (roadBot - roadTop) * 0.76;

  ctx.strokeStyle = 'rgba(255,255,255,.10)'; ctx.lineWidth = 2;
  ctx.setLineDash([26,20]);
  ctx.lineDashOffset = -(camDist * pxPerM) % 46;
  ctx.beginPath(); ctx.moveTo(0, laneNearY+34); ctx.lineTo(W, laneNearY+34); ctx.stroke();
  ctx.beginPath(); ctx.moveTo(0, laneFarY+34);  ctx.lineTo(W, laneFarY+34);  ctx.stroke();
  ctx.setLineDash([]);

  const finX = playerX + (QUARTER - camDist) * pxPerM;
  if (finX > -120 && finX < W+120){
    const cell = 14;
    for (let yy = roadTop; yy < roadBot+12; yy += cell)
      for (let k = 0; k < 2; k++){
        ctx.fillStyle = ((Math.floor(yy/cell)+k) % 2) ? '#f2f4ff' : '#1b1c26';
        ctx.fillRect(finX - cell + k*cell, yy, cell, cell);
      }
    ctx.fillStyle = 'rgba(255,255,255,.85)';
    ctx.font = 'bold 15px sans-serif'; ctx.textAlign = 'center';
    ctx.fillText('ФИНИШ', finX, roadTop - 16);
  }

  let oppX = playerX + (opp.dist - player.dist) * pxPerM;
  const margin = 78;
  let clamped = false;
  if (oppX < margin){ oppX = margin; clamped = true; }
  if (oppX > W - margin){ oppX = W - margin; clamped = true; }

  drawCar(ctx, oppX, laneFarY, 0.78, opp.wheelAngle, opp.colors,
          opp.boostTimer, opp.flashTimer, opp.visualUpg, null, opp.cosmetic);
  drawCar(ctx, playerX, laneNearY, 1.0, player.wheelAngle, player.colors,
          player.boostTimer, player.flashTimer, player.visualUpg, player.clanTag, player.cosmetic);

  if (clamped){
    const ahead = opp.dist > player.dist;
    const gap = Math.abs(opp.dist - player.dist).toFixed(0);
    ctx.fillStyle = ahead ? '#4dffa0' : '#ff5d5d';
    ctx.font = 'bold 15px monospace';
    ctx.textAlign = ahead ? 'right' : 'left';
    const tx = ahead ? W - 18 : 18;
    ctx.fillText((ahead ? '▶ ' : '◀ ') + gap + ' м', tx, laneFarY - 68);
  }

  drawHUD();

  if (state.phase === 'countdown'){
    const n = Math.ceil(state.countdown);
    const frac = state.countdown - Math.floor(state.countdown);
    ctx.save();
    ctx.globalAlpha = 0.25 + 0.75 * frac;
    ctx.textAlign = 'center';
    ctx.font = '900 ' + Math.min(180, W*0.24) + 'px sans-serif';
    ctx.fillStyle = n <= 1 ? '#4dffa0' : '#ffd166';
    ctx.shadowColor = ctx.fillStyle; ctx.shadowBlur = 50;
    ctx.fillText(n > 0 ? n : 'GO!', W/2, H*0.52);
    ctx.restore();
  }
}

/* ============ HUD ============ */
function drawHUD(){
  if (!player || !opp) return;
  const pad = 18, topH = 96;
  const pg = ctx.createLinearGradient(0,0,0,topH);
  pg.addColorStop(0,'rgba(8,11,24,.92)');
  pg.addColorStop(1,'rgba(8,11,24,.55)');
  ctx.fillStyle = pg; ctx.fillRect(0,0,W,topH);

  const barY = 6, barH = 6, barX = pad, barW = W - pad*2;
  ctx.fillStyle = 'rgba(255,255,255,.09)';
  roundRect(barX, barY, barW, barH, 3); ctx.fill();
  const pf = Math.min(1, player.dist / QUARTER);
  const of_ = Math.min(1, opp.dist / QUARTER);
  ctx.fillStyle = 'rgba(230,57,70,.75)';
  roundRect(barX, barY, Math.max(3, barW*pf), barH, 3); ctx.fill();
  ctx.fillStyle = '#2f7bff';
  ctx.beginPath(); ctx.arc(barX + barW*of_, barY+barH/2, 6, 0, Math.PI*2); ctx.fill();
  ctx.strokeStyle = 'rgba(255,255,255,.6)'; ctx.lineWidth = 1.5; ctx.stroke();
  ctx.fillStyle = '#ff6b6b';
  ctx.beginPath(); ctx.arc(barX + barW*pf, barY+barH/2, 6, 0, Math.PI*2); ctx.fill();
  ctx.strokeStyle = 'rgba(255,255,255,.85)'; ctx.stroke();

  ctx.textAlign = 'left';
  ctx.font = '11px sans-serif'; ctx.fillStyle = '#7d8fb5';
  ctx.fillText('ВРЕМЯ', pad, 34);
  ctx.font = 'bold 30px monospace'; ctx.fillStyle = '#fff';
  ctx.fillText(state.raceTime.toFixed(2), pad, 66);

  ctx.textAlign = 'center';
  ctx.font = '11px sans-serif'; ctx.fillStyle = '#7d8fb5';
  ctx.fillText('ДИСТАНЦИЯ', W/2, 34);
  ctx.font = 'bold 22px monospace';
  ctx.fillStyle = player.finished ? '#4dffa0' : '#cfe0ff';
  ctx.fillText(Math.min(player.dist, QUARTER).toFixed(0) + ' / 402 м', W/2, 64);

  ctx.textAlign = 'right';
  ctx.font = '11px sans-serif'; ctx.fillStyle = '#7d8fb5';
  ctx.fillText('КМ/Ч', W - pad, 34);
  ctx.font = 'bold 30px monospace';
  ctx.fillStyle = player.limiter ? '#ff5d5d' : '#fff';
  ctx.fillText(Math.round(player.speed * 3.6), W - pad, 66);

  const gx = W - pad - 108;
  ctx.save();
  const gearActive = player.shiftTimer > 0;
  ctx.fillStyle = gearActive ? 'rgba(255,209,102,.18)' : 'rgba(255,255,255,.07)';
  roundRect(gx-30, 20, 56, 50, 10); ctx.fill();
  ctx.strokeStyle = gearActive ? 'rgba(255,209,102,.8)' : 'rgba(140,170,230,.35)';
  ctx.lineWidth = 2;
  roundRect(gx-30, 20, 56, 50, 10); ctx.stroke();
  ctx.textAlign = 'center';
  ctx.font = 'bold 30px monospace';
  ctx.fillStyle = gearActive ? '#ffd166' : '#e7eeff';
  ctx.fillText(String(player.gear+1), gx-2, 58);
  ctx.restore();

  const tx = pad, ty = 76, tw = W - pad*2, th = 12;
  ctx.fillStyle = 'rgba(255,255,255,.07)';
  roundRect(tx, ty, tw, th, th/2); ctx.fill();
  const pStart = tx + tw * (PERFECT / MAX_RPM);
  const pEnd   = tx + tw * 0.945;
  ctx.fillStyle = 'rgba(77,255,160,.22)';
  ctx.fillRect(pStart, ty, pEnd - pStart, th);
  ctx.fillStyle = 'rgba(255,70,70,.28)';
  ctx.fillRect(tx + tw*0.945, ty, tw*0.055, th);
  const rf = Math.max(0, Math.min(1, player.rpm / MAX_RPM));
  if (rf > 0.004){
    const rg = ctx.createLinearGradient(tx,0,tx+tw,0);
    rg.addColorStop(0,'#2a6cff'); rg.addColorStop(0.45,'#00d4ff');
    rg.addColorStop(0.78,'#7dffb0'); rg.addColorStop(0.90,'#ffd166'); rg.addColorStop(1,'#ff3b3b');
    ctx.fillStyle = rg;
    roundRect(tx, ty, tw*rf, th, th/2); ctx.fill();
  }
  if (rf > 0.02){
    ctx.fillStyle = '#fff'; ctx.shadowColor = '#fff'; ctx.shadowBlur = 10;
    ctx.beginPath(); ctx.arc(tx + tw*rf, ty+th/2, 4, 0, Math.PI*2); ctx.fill();
    ctx.shadowBlur = 0;
  }

  // Tournament badge
  if (state.tournament){
    const t = TOURNAMENTS.find(x => x.id === state.tournament.id);
    if (t){
      const label = 'ТУРНИР · ' + (state.tournament.currentRace+1) + '/' + t.races.length;
      ctx.font = 'bold 12px sans-serif';
      const tw2 = ctx.measureText(label).width + 22;
      ctx.fillStyle = 'rgba(255,209,102,.15)';
      ctx.strokeStyle = 'rgba(255,209,102,.5)';
      ctx.lineWidth = 1;
      roundRect(W/2 - tw2/2, 104, tw2, 24, 12);
      ctx.fill(); ctx.stroke();
      ctx.fillStyle = '#ffd166';
      ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
      ctx.fillText(label, W/2, 116);
      ctx.textBaseline = 'alphabetic';
    }
  }

  // District attack badge
  if (state.districtAttack){
    const d = DISTRICTS.find(x => x.id === state.districtAttack.districtId);
    if (d){
      const label = 'БИТВА ЗА: ' + d.name;
      ctx.font = 'bold 12px sans-serif';
      const tw2 = ctx.measureText(label).width + 22;
      ctx.fillStyle = 'rgba(230,57,70,.18)';
      ctx.strokeStyle = 'rgba(230,57,70,.6)';
      ctx.lineWidth = 1;
      roundRect(W/2 - tw2/2, 104, tw2, 24, 12);
      ctx.fill(); ctx.stroke();
      ctx.fillStyle = '#ff8a8a';
      ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
      ctx.fillText(label, W/2, 116);
      ctx.textBaseline = 'alphabetic';
    }
  }

  // Clan tag
  if (player.clanTag){
    ctx.save();
    ctx.font = 'bold 11px monospace';
    const tagW = ctx.measureText(player.clanTag).width + 16;
    ctx.fillStyle = (player.clanColor || '#3d7bff') + '33';
    ctx.strokeStyle = (player.clanColor || '#3d7bff') + '88';
    ctx.lineWidth = 1;
    roundRect(W - pad - tagW, 104, tagW, 20, 10);
    ctx.fill(); ctx.stroke();
    ctx.fillStyle = player.clanColor || '#cfe0ff';
    ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
    ctx.fillText(player.clanTag, W - pad - tagW/2, 114);
    ctx.textBaseline = 'alphabetic';
    ctx.restore();
  }
}
function roundRect(x, y, w, h, r){
  if (w < r*2) r = w/2;
  if (h < r*2) r = h/2;
  ctx.beginPath();
  ctx.moveTo(x+r, y);
  ctx.arcTo(x+w, y,   x+w, y+h, r);
  ctx.arcTo(x+w, y+h, x,   y+h, r);
  ctx.arcTo(x,   y+h, x,   y,   r);
  ctx.arcTo(x,   y,   x+w, y,   r);
  ctx.closePath();
}

/* ============ CANVAS SETUP ============ */
const canvasEl = document.getElementById('game');
const ctx = canvasEl.getContext('2d');
let W = 0, H = 0, DPR = 1;
function resize(){
  DPR = Math.min(window.devicePixelRatio || 1, 2);
  W = window.innerWidth; H = window.innerHeight;
  canvasEl.width = Math.floor(W*DPR); canvasEl.height = Math.floor(H*DPR);
  canvasEl.style.width = W + 'px'; canvasEl.style.height = H + 'px';
  ctx.setTransform(DPR, 0, 0, DPR, 0, 0);
}
window.addEventListener('resize', resize);
resize();

/* ============ ЦИКЛ ============ */
let lastT = 0;
function loop(t){
  if (!lastT) lastT = t;
  let dt = (t - lastT) / 1000;
  lastT = t;
  if (dt > 0.05) dt = 0.05;
  update(dt);
  const hubScreens = ['hub','shop','tuning','styling','clans','territory','tournaments'];
  if (hubScreens.includes(state.phase)){
    updateHubParticles(dt);
    drawHub(t);
  } else {
    drawRace();
  }
  updateEngineSound();
  requestAnimationFrame(loop);
}

/* ============ СТАРТ ============ */
try {
  loadSave();
  resetRace({});
  showHub();
  requestAnimationFrame(loop);
} catch(e){
  errBox.style.display = 'block';
  errBox.textContent = 'ОШИБКА ИНИЦИАЛИЗАЦИИ: ' + e.message + '\n' + e.stack;
}
</script>
